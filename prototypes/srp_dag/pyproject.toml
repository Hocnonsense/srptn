[project]
name = "srp-dag"
version = "0.0.1"
description = "srptn prototype: snakemake logger plugin + DAG export transit layer"
requires-python = ">=3.11"
dependencies = [
    "snakemake-interface-logger-plugins>=1.2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["srp_dag", "snakemake_logger_plugin_srp_dag"]
