[project]
authors = [{ name = "Johannes Koester", email = "johannes.koester@uni-due.de" }]
name = "srptn"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
    "streamlit>=1.57,<2",
    "humanfriendly>=10.0,<11",
    "libtmux>=0.46.1,<0.47",
    "snakedeploy>=0.11.0,<0.12",
    "snakemake>=9.5.1,<10",
    "streamlit-ace>=0.1.1,<0.2",
    "packaging>=21.0,<22.0",
    "setuptools>=80.8.0,<81",
    "streamlit-tags>=1.2.8,<2",
    "polars>=1.30.0,<2",
    "streamlit-sortables>=0.3.1,<0.4",
    "bcrypt>=4.0,<6",
    "jsonschema>=4.20,<5",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
srptn = { path = ".", editable = true }

[tool.pixi.dependencies]
tmux = ">=3.5,<4"
pip = ">=26.1.2,<27"
nodejs = ">=22,<23"

[tool.pixi.feature.dev]
pypi-dependencies = { pytest = "*", ruff = "*", pyright = "*" }

[tool.pixi.environments]
dev = ["dev"]

[tool.pixi.tasks]
server = "streamlit run src/srptn/home.py"
tests = "pytest -v"
fmt = "ruff format src tests"
lint = "ruff check src tests"
accounts = "python -m srptn.accounts_manage"
web-install = "npm --prefix prototypes/srptn-figure-editor ci --no-audit --no-fund"
web = "npm --prefix prototypes/srptn-figure-editor run dev"
web-build = "npm --prefix prototypes/srptn-figure-editor run build"
web-test = "npm --prefix prototypes/srptn-figure-editor run test"
web-typecheck = "npm --prefix prototypes/srptn-figure-editor run typecheck"

[tool.hatch.build]
artifacts = ["src/srptn/common/components/figure_editor_dist/**/*"]
